<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#252d38">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SearchClipped</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- ===== HEADER ===== -->
  <header id="header">
    <div id="title-row">
    <span id="sc-title">SearchClipped</span>
    <span id="sc-version"></span>
  </div>
  <div id="search-row">
      <label class="cb-wrap" title="Select all">
        <input type="checkbox" id="cb-select-all">
        <span class="cb-mark"></span>
        <span class="cb-label">all</span>
      </label>
      <label class="cb-wrap" title="Select filtered results only">
        <input type="checkbox" id="cb-select-filtered">
        <span class="cb-mark"></span>
        <span class="cb-label">filt</span>
      </label>
      <div class="search-input-wrap">
        <input type="text" id="search-input"
               placeholder="Search items and tags…"
               autocomplete="off" spellcheck="false">
        <button id="btn-star-filter" class="icon-btn" title="Show starred first">☆</button>
      </div>
      <button id="btn-undo" class="icon-btn" title="Undo" disabled>↶</button>
      <button id="btn-redo" class="icon-btn" title="Redo" disabled>↷</button>
    </div>
    <div id="filter-row">
      <button id="btn-show-deleted" class="eye-btn" title="Show deleted">
        <svg class="eye-open" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 7s2.3-4.5 6-4.5S13 7 13 7s-2.3 4.5-6 4.5S1 7 1 7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="7" cy="7" r="1.8" stroke="currentColor" stroke-width="1.4"/></svg>
        <svg class="eye-closed" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2l10 10M5.5 5.6A1.8 1.8 0 019.4 8.5M3.8 3.9C2.5 4.9 1.5 6.3 1 7c1.2 1.9 3.5 4.5 6 4.5 1.2 0 2.3-.5 3.2-1.2M6.5 2.6C6.7 2.5 6.8 2.5 7 2.5c2.5 0 4.8 2.6 6 4.5-.4.6-.9 1.3-1.5 1.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="eye-label">deleted</span>
      </button>
      <button id="btn-hide-undeleted" class="eye-btn" title="Hide undeleted">
        <svg class="eye-closed" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 7s2.3-4.5 6-4.5S13 7 13 7s-2.3 4.5-6 4.5S1 7 1 7z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="7" cy="7" r="1.8" stroke="currentColor" stroke-width="1.4"/></svg>
        <svg class="eye-open" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 2l10 10M5.5 5.6A1.8 1.8 0 019.4 8.5M3.8 3.9C2.5 4.9 1.5 6.3 1 7c1.2 1.9 3.5 4.5 6 4.5 1.2 0 2.3-.5 3.2-1.2M6.5 2.6C6.7 2.5 6.8 2.5 7 2.5c2.5 0 4.8 2.6 6 4.5-.4.6-.9 1.3-1.5 1.9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="eye-label">undeleted</span>
      </button>
      <label class="cb-wrap" title="Search tags only">
        <input type="checkbox" id="cb-tags-only">
        <span class="cb-mark"></span>
        <span class="cb-label">tags only</span>
      </label>
      <div id="sort-wrap">
        <span id="sort-label">sort by:</span>
        <select id="sort-select">
          <option value="id-asc">Smallest ID</option>
          <option value="id-desc">Largest ID</option>
          <option value="created-desc">Newest Created</option>
          <option value="created-asc">Oldest Created</option>
          <option value="modified-desc">Newest Modified</option>
          <option value="modified-asc">Oldest Modified</option>
        </select>
      </div>
    </div>
    <div id="action-row">
      <button id="btn-bulk-delete" class="action-btn danger"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 4h10M5 4V2.5a.5.5 0 01.5-.5h3a.5.5 0 01.5.5V4M6 7v3.5M8 7v3.5M3 4l.8 7.2a1 1 0 001 .8h4.4a1 1 0 001-.8L11 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="btn-bulk-copy"   class="action-btn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 10H2a1 1 0 01-1-1V2a1 1 0 011-1h7a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button id="btn-export"      class="action-btn">Export</button>
      <label  class="action-btn import-label" title="Import JSON export">
        Import
        <input type="file" id="import-input" accept=".json" hidden>
      </label>
    </div>
  </header>
  <!-- ===== ITEM LIST ===== -->
  <main id="item-list"></main>
  <!-- ===== PERMISSION TOAST ===== -->
  <div id="perm-toast" class="toast hidden">
    <span id="perm-msg"></span>
    <div class="toast-btns">
      <button id="perm-allow">Allow</button>
      <button id="perm-deny">Deny</button>
      <button id="perm-never">Never</button>
    </div>
  </div>
  <!-- ===== CONFIRM MODAL ===== -->
  <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <p id="confirm-msg"></p>
      <input type="text" id="confirm-input" placeholder='Type "yes" to confirm'
             autocomplete="off" autocorrect="off" autocapitalize="off">
      <div class="modal-btns">
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-ok" class="danger">OK</button>
      </div>
    </div>
  </div>
  <!-- ===== TAG EDITOR MODAL ===== -->
  <div id="tag-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h3>Edit Tags</h3>
      <div id="tag-list-edit"></div>
      <div id="tag-input-row">
        <input type="text" id="tag-input" placeholder="New tag…"
               autocomplete="off" autocorrect="off" autocapitalize="off">
        <button id="tag-add-btn">Add</button>
      </div>
      <div class="modal-btns">
        <button id="tag-done">Done</button>
      </div>
    </div>
  </div>
</div><!-- #app -->
<script src="db.js"></script>
<script src="state.js"></script>
<script src="permissions.js"></script>
<script src="clipboard.js"></script>
<script src="search.js"></script>
<script src="render.js"></script>
<script src="modals.js"></script>
<script src="items.js"></script>
<script src="app.js"></script>
</body>
</html>
