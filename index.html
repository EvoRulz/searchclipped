  <link rel="icon" href="data:,">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SearchClipped</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">

<body>
<div id="app">
  <!-- ===== HEADER ===== -->
  <header id="header">
    <div id="title-row">
    <span id="sc-title">SearchClipped</span>
    <span id="sc-version"></span>
    <div class="title-row-right">
      <button id="btn-profiles" class="profile-open-btn" title="Profiles">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="profile-device-icons" class="profile-device-icons"></div>
      <button id="auth-btn" class="auth-circle" title="Sign in with Google"></button>
    </div>
  </div>
  <div id="search-row">
      <div class="cb-wrap" id="cb-select-filtered-wrap" title="Select filtered results only">
        <canvas id="cb-select-filtered" class="version-sel-canvas" width="13" height="13"></canvas>
        <span class="cb-label">filt</span>
      </div>
      <div class="search-input-wrap">
        <input type="text" id="search-input"
               placeholder="Search items, titles, tags..."
               autocomplete="off" spellcheck="false">
        <button id="btn-clear-search" class="icon-btn" title="Clear search" style="display:none">×</button>
        <button id="btn-star-filter" class="icon-btn" title="Show starred first" data-alt="s">☆</button>
      </div>
      <button id="btn-undo" class="icon-btn" title="Undo" disabled data-alt="z">↶</button>
      <button id="btn-redo" class="icon-btn" title="Redo" disabled data-alt="y">↷</button>
      </div>
    <div id="search-options-row">
      <button id="btn-show-deleted" class="eye-btn" title="Show deleted" data-alt="d">
        <svg class="eye-open" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.5 7 Q4 4 7 4 Q10 4 13.5 7 Q10 10 7 10 Q4 10 0.5 7 Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="7" cy="7" r="2.6" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="7" r="1" fill="currentColor"/></svg>
        <svg class="eye-closed" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 7 L4 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10 7 L13 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/></svg>
        <span class="eye-label">deleted</span>
      </button>
      <button id="btn-toggle-filter-row" class="action-btn" data-alt="m" data-alt-filter="m">hide</button>
      <label class="cb-wrap" title="Search item content">
        <input type="checkbox" id="cb-search-items" checked>
        <span class="cb-mark"></span>
        <span class="cb-label">items</span>
      </label>
      <label class="cb-wrap" title="Search titles">
        <input type="checkbox" id="cb-search-titles" checked>
        <span class="cb-mark"></span>
        <span class="cb-label">titles</span>
      </label>
      <label class="cb-wrap" title="Search tags">
        <input type="checkbox" id="cb-search-tags" checked>
        <span class="cb-mark"></span>
        <span class="cb-label">tags</span>
      </label>
      <span id="search-results-count" class="search-results-count"></span>
      <div id="sort-wrap"><span id="sort-label">sort by:</span>
      <select id="sort-select">
        <option value="id-asc">Smallest ID</option>
        <option value="id-desc">Largest ID</option>
        <option value="created-desc">Newest Created</option>
        <option value="created-asc">Oldest Created</option>
        <option value="modified-desc">Newest Modified</option>
        <option value="modified-asc">Oldest Modified</option>
        <option value="deleted-desc">Newest Deleted</option>
        <option value="deleted-asc">Oldest Deleted</option>
        <option value="restored-desc">Newest Restored</option>
        <option value="restored-asc">Oldest Restored</option>
        <option value="copied-desc">Most Copied</option>
        <option value="copied-asc">Least Copied</option>
      </select></div>
      </div>

        <svg class="eye-open" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.5 7 Q4 4 7 4 Q10 4 13.5 7 Q10 10 7 10 Q4 10 0.5 7 Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="7" cy="7" r="2.6" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="7" r="1" fill="currentColor"/></svg>
        <svg class="eye-closed" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 7 L4 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10 7 L13 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/></svg>
        <span class="eye-label">newlines</span>
      </button>
      <button id="btn-tag-count-mode" class="eye-btn" title="Tag pill count badges" data-alt-filter="p">
        <svg class="eye-closed" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 7 L4 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10 7 L13 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/></svg>
        <svg class="eye-open" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.5 7 Q4 4 7 4 Q10 4 13.5 7 Q10 10 7 10 Q4 10 0.5 7 Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="7" cy="7" r="2.6" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="7" r="1" fill="currentColor"/></svg>
        <svg class="eye-wide" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="7" r="2.8" fill="currentColor"/></svg>
        <span class="eye-label">tag count</span>
      </button>
      <button id="btn-tag-x-mode" class="eye-btn" title="Tag pill x buttons" data-alt-filter="v">
        <svg class="eye-closed" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M1 7 L4 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M10 7 L13 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/></svg>
        <svg class="eye-open" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M0.5 7 Q4 4 7 4 Q10 4 13.5 7 Q10 10 7 10 Q4 10 0.5 7 Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="7" cy="7" r="2.6" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="7" r="1" fill="currentColor"/></svg>
        <svg class="eye-wide" width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="7" r="2.8" fill="currentColor"/></svg>
        <span class="eye-label">tag x</span>
      </button>
      <label class="peek-thresh-wrap" title="Peek behaviour threshold: plain text below this character count, diff above">peek: <input type="number" id="peek-threshold-input" value="200" min="0" max="9999"></label>
      </div>
    <div id="action-row">
      <div class="cb-wrap" id="cb-select-all-wrap" title="Select all">
        <canvas id="cb-select-all" class="version-sel-canvas" width="13" height="13"></canvas>
        <span class="cb-label">all</span>
      </div>
      <button id="btn-bulk-delete" class="action-btn danger"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 4h10M5 4V2.5a.5.5 0 01.5-.5h3a.5.5 0 01.5.5V4M6 7v3.5M8 7v3.5M3 4l.8 7.2a1 1 0 001 .8h4.4a1 1 0 001-.8L11 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="btn-bulk-burn" class="action-btn" title="Burn selected (permanent)">
        <svg
          width="14"
          height="14"
          viewBox="0 0 14 14"
          fill="none"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M 7 1.5
               C 8.5 2.5, 9.5 4.5, 9 6
               C 9.5 5, 11 3.5, 10.5 3.5
               C 11.5 4.5, 12 7, 11.5 9
               C 11.5 11.5, 9.5 13, 7 13
               C 4.5 13, 2.5 11.5, 2.5 9
               C 2.5 7.5, 2 5, 3.5 3.5
               C 3 3, 4 4.5, 5 6
               C 4.5 4.5, 5.5 2.5, 7 1.5 Z"
            stroke="currentColor"
            stroke-width="1.2"
            stroke-linejoin="round"
            fill="none"/>
          <path
            d="M 7 7.5
               C 8.5 8.5, 8.5 10.5, 7 11.5
               C 5.5 10.5, 5.5 8.5, 7 7.5 Z"
            fill="currentColor"/>
        </svg>
      </button>
      <button id="btn-bulk-copy"   class="action-btn"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="9" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 10H2a1 1 0 01-1-1V2a1 1 0 011-1h7a1 1 0 011 1v1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      <button id="btn-export"      class="action-btn" data-alt="e">Export</button>
      <label  class="action-btn import-label" title="Import JSON export">
        Import
        <input type="file" id="import-input" accept=".json" hidden>
      </label>
      <button id="btn-jump" class="action-btn" title="Jump to top/bottom" data-alt="j" style="display:none">Jump <span id="btn-jump-chip"> &#9660;</span></button>
      </div>
  </header>
  <!-- ===== ITEM LIST ===== -->
  <div id="scroll-layout">
    <div id="scroll-left" aria-hidden="true"></div>
    <main id="item-list">
    <div id="storage-row">
      <div class="storage-line">
        <span class="storage-label">localStorage</span>
        <div class="storage-bar-bg"><div class="storage-bar-fill" id="storage-ls-fill"></div></div>
        <span class="storage-val" id="storage-ls-val">—</span>
      </div>
      <div class="storage-line">
        <span class="storage-label">origin total</span>
        <div class="storage-bar-bg"><div class="storage-bar-fill storage-bar-origin" id="storage-origin-fill"></div></div>
        <span class="storage-val" id="storage-origin-val">—</span>
      </div>
    </div>
  </main>
    <div id="scroll-right" aria-hidden="true"></div>
  </div>
  <!-- ===== PERMISSION TOAST ===== -->
  <div id="perm-toast" class="toast hidden">
    <span id="perm-msg"></span>
    <div class="toast-btns">
      <button id="perm-allow">Allow</button>
      <button id="perm-deny">Deny</button>
      <button id="perm-never">Never</button>
    </div>
  </div>
  <!-- ===== CONFIRM MODAL ===== -->
  <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <p id="confirm-msg"></p>
      <input type="text" id="confirm-input" placeholder='Type "yes" to confirm'
             autocomplete="off" autocorrect="off" autocapitalize="off">
      <div class="modal-btns">
        <button id="confirm-cancel">Cancel</button>
        <button id="confirm-ok" class="danger">OK</button>
      </div>
    </div>
  </div>
<!-- ===== PROFILE PANEL ===== -->
  <div id="profile-panel" class="modal hidden" role="dialog" aria-modal="true">
    <div class="profile-panel-box">
      <div class="profile-panel-header">
        <span class="profile-panel-title">Profiles</span>
        <button id="btn-pull-cloud" class="profile-panel-pull-btn" title="Pull from cloud"></button>
        <button id="profile-panel-close" class="profile-panel-close-btn">×</button>
      </div>
      <div id="profile-list" class="profile-list"></div>
      <div class="profile-panel-footer">
        <button id="btn-add-profile" class="action-btn">+ Add Profile</button>
        <div id="profile-status-msg" class="profile-status-msg" style="display:none"></div>
      </div>
      <div id="add-profile-form" class="add-profile-form" style="display:none">
        <input type="text" id="new-profile-name" placeholder="Profile name..." autocomplete="off">
        <div class="add-profile-icon-row">
          <input type="text" id="new-profile-icon" placeholder="Icon: SVG string, URL, or emoji (optional)..." autocomplete="off">
          <input type="color" id="new-profile-color" value="#5c9edb" title="Fallback colour for initials">
        </div>
        <div class="add-profile-source-wrap">
          <span class="add-profile-source-label">Copy items from (optional):</span>
          <div id="add-profile-sources" class="add-profile-sources"></div>
        </div>
        <div class="add-profile-form-btns">
          <button id="confirm-add-profile" class="action-btn">Create</button>
          <button id="cancel-add-profile" class="action-btn">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div><!-- #app -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="db.js"></script>
<script src="state.js"></script>
<script src="permissions.js"></script>
<script src="clipboard.js"></script>
<script src="search.js"></script>
<script src="render.js"></script>
<script src="modals.js"></script>
<script src="profiles.js"></script>
<script src="items.js"></script>
<script src="app.js"></script>
</body>
</html>
